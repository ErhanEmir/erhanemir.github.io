<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Sinyal Koptu | Erhan Emir</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ef4444' d='M12 18a2 2 0 100 4 2 2 0 000-4zm-7.07-2.93l1.41 1.41A8 8 0 0112 14a8 8 0 015.66 2.34l1.41-1.41A10 10 0 0012 12a10 10 0 00-7.07 2.93zM4.93 7.93l1.41 1.41A12 12 0 0112 6a12 12 0 018.49 3.51l1.41-1.41A14 14 0 0012 4 14 14 0 004.93 7.93z'/%3E%3C/svg%3E">
    <style>
        :root { --bg: #050a10; --cyan: #22d3ee; --green: #34d399; --red: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: #e8eef4; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 2rem 1.5rem;
        }
        .card {
            max-width: 620px; width: 100%; background: #080f1a; border-radius: 14px;
            padding: 2.5rem 2rem; border: 1px solid rgba(255,255,255,0.07);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 900; letter-spacing: 1px; color: var(--red); text-shadow: 0 0 15px rgba(239,68,68,0.5); margin-bottom: 0.8rem; }
        p { max-width: 520px; color: #a0aec0; margin: 0 auto 1.6rem; line-height: 1.7; }
        .btn { display: inline-flex; align-items: center; padding: 0.75rem 1.8rem; border-radius: 8px; background: var(--cyan); color: #050a10; font-weight: 800; text-decoration: none; }
        .btn:hover { background: var(--green); }
        .esp-stage { position: relative; width: 240px; height: 190px; margin: 0 auto 1.2rem; }
        .esp-mcu {
            position: absolute; left: 50%; bottom: 25px; transform: translateX(-50%);
            width: 120px; height: 75px; background: #064e3b; border: 2px solid #34d399;
            border-radius: 8px; box-shadow: 0 0 20px rgba(52,211,153,0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .esp-chip { width: 45px; height: 45px; background: #1e293b; border: 1px solid #94a3b8; border-radius: 4px; display: grid; place-items: center; font-size: 8px; color: #34d399; font-weight: bold; }
        .esp-led {
            position: absolute; top: 8px; right: 10px; width: 10px; height: 10px; border-radius: 50%;
            background: #ef4444; box-shadow: 0 0 12px #ef4444; animation: rapidBlink 0.25s infinite alternate;
        }
        @keyframes rapidBlink { 0% { opacity: 0.2; } 100% { opacity: 1; } }
        .lora-ant {
            position: absolute; left: 15px; top: -35px; width: 6px; height: 40px;
            background: #475569; border-radius: 3px; border-top: 3px solid #ef4444;
        }
        .wave-ring {
            position: absolute; left: 15px; top: -35px; width: 20px; height: 20px; margin-left: -7px; margin-top: -7px;
            border: 2px solid #ef4444; border-radius: 50%; opacity: 0;
            animation: waveExpand 1.5s ease-out infinite; pointer-events: none;
        }
        .wave-ring:nth-child(2) { animation-delay: 0.5s; }
        .wave-ring:nth-child(3) { animation-delay: 1s; }
        @keyframes waveExpand {
            0% { transform: scale(0.3); opacity: 0.9; }
            100% { transform: scale(4.5); opacity: 0; }
        }
        @media (max-width: 768px) { .card { padding: 2rem 1.2rem; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="esp-stage">
            <div class="lora-ant"></div>
            <div class="wave-ring"></div>
            <div class="wave-ring"></div>
            <div class="wave-ring"></div>
            <div class="esp-mcu">
                <div class="esp-led"></div>
                <div class="esp-chip">ESP32</div>
            </div>
        </div>
        <h1>SİNYAL KOPTU</h1>
        <p>Sinyal koptu! Wi-Fi / LoRa modülü bağlantıyı kaybetti. Bağlantı gelince sistem otomatik senkronize olacak.</p>
        <a href="index.html" class="btn">Ana Üsse Dön</a>
    </div>
</body>
</html>
