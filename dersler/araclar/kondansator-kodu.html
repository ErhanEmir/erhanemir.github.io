<html lang="tr" data-theme="dark">
<head>

<title>Kondansatör Kodu | Araçlar</title>
<meta name="robots" content="noindex">
<style>:root{--bg:#050a10;--card:#0a1220;--yazi:#e8eef4;--soluk:#8890a0;--cyan:#22d3ee;--mor:#818cf8;--yesil:#34d399;--kirmizi:#f87171;--cerceve:rgba(255,255,255,.08)}[data-theme="light"]{--bg:#eef3f8;--card:#ffffff;--yazi:#0f172a;--soluk:#526075;--cyan:#0891b2;--mor:#4f46e5;--yesil:#059669;--kirmizi:#dc2626;--cerceve:rgba(15,23,42,.12)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--yazi);min-height:100vh}.kapsayici{max-width:560px;margin:0 auto;padding:2rem 1rem}.ustbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}a.don{color:var(--cyan);text-decoration:none;font-weight:700}.kart{background:var(--card);border:1px solid var(--cerceve);border-radius:14px;padding:1.4rem;position:relative;overflow:hidden}.kart::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--mor),var(--cyan))}label{font-weight:700;font-size:.88rem;display:block;margin:.8rem 0 .3rem}input{width:100%;padding:.6rem;border-radius:8px;border:1px solid var(--cerceve);background:#020617;color:#fff;font-size:1rem;font-family:Consolas,monospace;letter-spacing:2px;text-transform:uppercase}[data-theme="light"] input{background:#f1f5f9;color:#0f172a}table{width:100%;border-collapse:collapse;margin-top:.8rem;font-size:.82rem}th,td{border:1px solid var(--cerceve);padding:.4rem .5rem;text-align:left}th{color:var(--cyan)}.sonuc{background:#020617;border-radius:10px;padding:.9rem;font-family:Consolas,monospace;font-size:.95rem;margin-top:.9rem;border:1px solid var(--cerceve);line-height:1.8}[data-theme="light"] .sonuc{background:#f1f5f9;color:#0f172a}#temaBtn{position:fixed;top:12px;right:12px;z-index:300;width:66px;height:34px;border-radius:20px;background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid rgba(34,211,238,.5);cursor:pointer;box-shadow:0 0 14px rgba(34,211,238,.25);transition:.25s;padding:0}#temaBtn .top{position:absolute;top:3px;left:4px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#fde047,#fb923c);display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:left .25s;color:#050a10}[data-theme="light"] #temaBtn .top{left:34px;background:linear-gradient(135deg,#38bdf8,#0369a1);color:#fff}</style>
</head><body>
<button id="temaBtn" title="Tema / Theme" aria-label="Tema değiştir"><span class="top">☾</span></button>
<div class="kapsayici">
<div class="ustbar"><a class="don" href="index.html">← Araçlar</a></div>
<div class="kart"><h2>Kondansatör Kodu Çözücü</h2>
<p style="color:var(--soluk);font-size:.88rem">Seramik disk ve film kondansatörlerde 3 haneli kod pikofarad (pF) cinsindendir: ilk iki rakam sayı, üçüncü rakam sıfır sayısıdır. Örnek: 104 → 100 nF.</p>
<label>Üzerindeki kod (örn: 104, 473, 221)</label><input id="inKod" placeholder="104" maxlength="4">
<div class="sonuc" id="sonuc">Kod girin.</div>
<table>
<tr><th>Kod</th><th>Değer</th></tr>
<tr><td>101</td><td>100 pF</td></tr>
<tr><td>102</td><td>1 nF</td></tr>
<tr><td>103</td><td>10 nF</td></tr>
<tr><td>104</td><td>100 nF</td></tr>
<tr><td>224</td><td>220 nF</td></tr>
<tr><td>474</td><td>470 nF</td></tr>
<tr><td>105</td><td>1 µF</td></tr>
</table>
</div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function(){
var TEMA="dark";try{TEMA=localStorage.getItem("portfolioTheme")||"dark";}catch(e){}
function uygula(){document.documentElement.setAttribute("data-theme",TEMA);var s=document.querySelector("#temaBtn .top");if(s)s.textContent=(TEMA==="dark")?"☾":"☀";}
uygula();
document.getElementById("temaBtn").addEventListener("click",function(){TEMA=(TEMA==="dark")?"light":"dark";try{localStorage.setItem("portfolioTheme",TEMA);}catch(e){}uygula();});
function $(id){return document.getElementById(id);}
function fmtC(pf){
if(pf>=1000000)return (Math.round(pf/10000)/100)+" µF";
if(pf>=1000)return (Math.round(pf/100)/10)+" nF";
return Math.round(pf)+" pF";
}
function coz(kod){
kod=(kod||"").trim().toUpperCase();
if(!/^[0-9]{3}$/.test(kod))return null;
var v=(parseInt(kod[0])*10+parseInt(kod[1]))*Math.pow(10,parseInt(kod[2]));
return {pf:v, metin:fmtC(v)};
}
function guncelle(){
var r=coz($("inKod").value);
if(!r){$("sonuc").textContent="3 haneli kod girin (örn: 104).";return null;}
$("sonuc").textContent=$("inKod").value.trim()+" → "+r.metin+" ("+r.pf+" pF)";
return r;
}
$("inKod").addEventListener("input",guncelle);
guncelle();
window.__kod={coz:coz,koy:function(k){$("inKod").value=k;return guncelle();},sonuc:function(){return $("sonuc").textContent;}};
});
</script>
</body></html>
