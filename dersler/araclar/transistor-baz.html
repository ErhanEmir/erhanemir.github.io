<head>

<title>Transistör Baz Direnci | Araçlar</title>
<meta name="robots" content="noindex">
<style>:root{--bg:#050a10;--card:#0a1220;--yazi:#e8eef4;--soluk:#8890a0;--cyan:#22d3ee;--yesil:#34d399;--kirmizi:#f87171;--cerceve:rgba(255,255,255,.08)}[data-theme="light"]{--bg:#eef3f8;--card:#ffffff;--yazi:#0f172a;--soluk:#526075;--cyan:#0891b2;--yesil:#059669;--kirmizi:#dc2626;--cerceve:rgba(15,23,42,.12)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--yazi);min-height:100vh}.kapsayici{max-width:560px;margin:0 auto;padding:2rem 1rem}.ustbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}a.don{color:var(--cyan);text-decoration:none;font-weight:700}.kart{background:var(--card);border:1px solid var(--cerceve);border-radius:14px;padding:1.4rem;position:relative;overflow:hidden}.kart::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--yesil),var(--cyan))}label{font-weight:700;font-size:.88rem;display:block;margin:.8rem 0 .3rem}input{width:100%;padding:.6rem;border-radius:8px;border:1px solid var(--cerceve);background:#020617;color:#fff;font-size:.95rem}[data-theme="light"] input{background:#f1f5f9;color:#0f172a}.satir{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.sonuc{background:#020617;border-radius:10px;padding:.9rem;font-family:Consolas,monospace;font-size:.9rem;margin-top:.9rem;border:1px solid var(--cerceve);line-height:1.8}[data-theme="light"] .sonuc{background:#f1f5f9;color:#0f172a}.uyari{display:none;border-radius:10px;padding:.8rem 1rem;margin-top:.8rem;border:1px solid;font-size:.88rem;line-height:1.6}.uyari.goster{display:block}.uyari.ok{background:rgba(52,211,153,.1);border-color:var(--yesil)}.uyari.hata{background:rgba(239,68,68,.1);border-color:var(--kirmizi)}#temaBtn{position:fixed;top:12px;right:12px;z-index:300;width:66px;height:34px;border-radius:20px;background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid rgba(34,211,238,.5);cursor:pointer;box-shadow:0 0 14px rgba(34,211,238,.25);transition:.25s;padding:0}#temaBtn .top{position:absolute;top:3px;left:4px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#fde047,#fb923c);display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:left .25s;color:#050a10}[data-theme="light"] #temaBtn .top{left:34px;background:linear-gradient(135deg,#38bdf8,#0369a1);color:#fff}</style>
</head><body>
<button id="temaBtn" title="Tema / Theme" aria-label="Tema değiştir"><span class="top">☾</span></button>
<div class="kapsayici">
<div class="ustbar"><a class="don" href="index.html">← Araçlar</a></div>
<div class="kart"><h2>Transistör Baz Direnci (Doyum Kuralı)</h2>
<p style="color:var(--soluk);font-size:.88rem">Anahtar gibi çalışması için Ib ≥ Ic / 10 olmalı. Rb = (Vkontrol − 0.7) / Ib. En yakın <b>alt</b> standart değer önerilir.</p>
<div class="satir">
<div><label>Kontrol voltajı (V)</label><input id="inVk" inputmode="decimal" value="5"></div>
<div><label>Hedef Ic (mA)</label><input id="inIc" inputmode="decimal" value="20"></div>
</div>
<div class="sonuc" id="sonuc">Değer girin.</div>
<div class="uyari" id="uyari"><b id="uyariBaslik"></b><p id="uyariMetin" style="margin-top:.3rem"></p></div>
</div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function(){
var TEMA="dark";try{TEMA=localStorage.getItem("portfolioTheme")||"dark";}catch(e){}
function uygula(){document.documentElement.setAttribute("data-theme",TEMA);var s=document.querySelector("#temaBtn .top");if(s)s.textContent=(TEMA==="dark")?"☾":"☀";}
uygula();
document.getElementById("temaBtn").addEventListener("click",function(){TEMA=(TEMA==="dark")?"light":"dark";try{localStorage.setItem("portfolioTheme",TEMA);}catch(e){}uygula();});
function $(id){return document.getElementById(id);}
var E12=[10,12,15,18,22,27,33,39,47,56,68,82];
function fmtR(v){if(v>=1000)return (Math.round(v/100)/10)+" kΩ";return Math.round(v)+" Ω";}
function altE12(v){
var exp=Math.floor(Math.log10(v))-1,enIyi=null;
for(var e=-1;e<=3;e++){for(var i=0;i<E12.length;i++){var a=E12[i]*Math.pow(10,exp+e);if(a<=v&&(enIyi===null||a>enIyi))enIyi=a;}}
return enIyi;
}
function coz(){
function sayi(id){var v=parseFloat(($(id).value||"").replace(",","."));return isNaN(v)?null:v;}
var Vk=sayi("inVk"),Icma=sayi("inIc");
var u=$("uyari");u.className="uyari";
if(Vk===null||Icma===null||Icma<=0){$("sonuc").textContent="Pozitif değerler girin.";return null;}
if(Vk<=0.7){$("sonuc").textContent="Kontrol voltajı 0.7 V üstü olmalıdır.";u.className="uyari goster hata";$("uyariBaslik").textContent="Sürülemez";$("uyariMetin").textContent="Baz-emiter eşiği aşılamıyor.";return null;}
var Ibmin=(Icma/1000)/10;
var Rbmax=(Vk-0.7)/Ibmin;
var Rb=altE12(Rbmax);
var gercelIb=(Vk-0.7)/Rb;
$("sonuc").innerHTML="Gerekli Ib ≥ "+(Ibmin*1000).toFixed(2)+" mA<br>Rb en fazla: "+fmtR(Rbmax)+"<br>Önerilen (E12 alt): "+fmtR(Rb)+"<br>Gerçek Ib: "+(gercelIb*1000).toFixed(2)+" mA (oran Ic/Ib = "+((Icma/1000)/gercelIb).toFixed(1)+", ≤10 olmalı)";
if((Icma/1000)/gercelIb<=10){u.className="uyari goster ok";$("uyariBaslik").textContent="Doyumda";$("uyariMetin").textContent="Transistör anahtar gibi çalışır.";}
else{u.className="uyari goster hata";$("uyariBaslik").textContent="Doyumda değil";$("uyariMetin").textContent="Direnci küçültün.";}
return {ib:Ibmin,rbMax:Rbmax,onerilen:Rb};
}
["inVk","inIc"].forEach(function(id){$(id).addEventListener("input",coz);});
coz();
window.__baz={coz:coz,koy:function(vk,ic){$("inVk").value=vk;$("inIc").value=ic;return coz();},sonuc:function(){return $("sonuc").textContent;}};
});
</script>
</body></html>
