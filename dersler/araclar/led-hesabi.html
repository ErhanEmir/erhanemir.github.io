<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">

<link rel="apple-touch-icon" href="/i.png">
<title>LED Direnci | Araçlar</title>
<meta name="robots" content="noindex">
<style>:root{--bg:#050a10;--card:#0a1220;--yazi:#e8eef4;--soluk:#8890a0;--cyan:#22d3ee;--yesil:#34d399;--kirmizi:#f87171;--cerceve:rgba(255,255,255,.08)}[data-theme="light"]{--bg:#eef3f8;--card:#ffffff;--yazi:#0f172a;--soluk:#526075;--cyan:#0891b2;--yesil:#059669;--kirmizi:#dc2626;--cerceve:rgba(15,23,42,.12)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--yazi);min-height:100vh}.kapsayici{max-width:560px;margin:0 auto;padding:2rem 1rem}.ustbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}a.don{color:var(--cyan);text-decoration:none;font-weight:700}.dugme{background:var(--card);color:var(--yazi);border:1px solid var(--cerceve);border-radius:20px;padding:.45rem .95rem;font-weight:800;cursor:pointer}#temaBtn{position:fixed;top:12px;right:12px;z-index:300}.kart{background:var(--card);border:1px solid var(--cerceve);border-radius:14px;padding:1.4rem}.kart h2{margin-bottom:.4rem}.kart p{color:var(--soluk);font-size:.88rem;line-height:1.6}label{font-weight:700;font-size:.88rem;display:block;margin:.8rem 0 .3rem}input,select{width:100%;padding:.6rem;border-radius:8px;border:1px solid var(--cerceve);background:#020617;color:#fff;font-size:.95rem}[data-theme="light"] input,[data-theme="light"] select{background:#f1f5f9;color:#0f172a}.satir{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.sonuc{background:#020617;border-radius:10px;padding:.9rem;font-family:Consolas,monospace;font-size:.92rem;margin-top:.9rem;border:1px solid var(--cerceve);line-height:1.8}[data-theme="light"] .sonuc{background:#f1f5f9;color:#0f172a}.uyari{display:none;border-radius:10px;padding:.8rem 1rem;margin-top:.8rem;border:1px solid;font-size:.88rem;line-height:1.6}.uyari.goster{display:block}.uyari.hata{background:rgba(239,68,68,.1);border-color:var(--kirmizi)}.uyari.ok{background:rgba(52,211,153,.1);border-color:var(--yesil)}</style><style>.kart{position:relative;overflow:hidden}.kart::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--cyan,#22d3ee),var(--yesil,#34d399))}.dugme,.tus button,.quiz button,.secrow select{transition:transform .15s,box-shadow .15s,border-color .15s}.dugme:hover,.tus button:hover{transform:translateY(-2px)}.mm-ekran,.ekran{box-shadow:inset 0 0 24px rgba(0,0,0,.5),0 0 18px rgba(52,211,153,.12)}a.don:hover{text-decoration:underline}</style>
</head><body>
<button id="temaBtn">☾</button>
<div class="kapsayici">
<div class="ustbar"><a class="don" href="index.html">← Araçlar</a></div>
<div class="kart"><h2>LED Seri Direnci</h2>
<p>Besleme voltajı, LED iletim voltajı ve hedef akımı girin. En yakın üst standart değer (E12) önerilir.</p>
<div class="satir">
<div><label>Besleme Vs (V)</label><input id="inVs" inputmode="decimal" value="5"></div>
<div><label>LED Vf (V)</label><input id="inVf" inputmode="decimal" value="2"></div>
</div>
<div class="satir">
<div><label>Hedef akım (mA)</label><input id="inIf" inputmode="decimal" value="15"></div>
<div><label>Direnç gücü min (W)</label><select id="inPw"><option>0.25</option><option>0.5</option><option>1</option></select></div>
</div>
<div class="sonuc" id="sonuc">Değer girin.</div>
<div class="uyari" id="uyari"><b id="uyariBaslik"></b><p id="uyariMetin" style="margin-top:.3rem"></p></div>
</div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function(){
var TEMA="dark";try{TEMA=localStorage.getItem("portfolioTheme")||"dark";}catch(e){}
function uygula(){document.documentElement.setAttribute("data-theme",TEMA);document.getElementById("temaBtn").textContent=(TEMA==="dark")?"☾":"☀";}
uygula();
document.getElementById("temaBtn").addEventListener("click",function(){TEMA=(TEMA==="dark")?"light":"dark";try{localStorage.setItem("portfolioTheme",TEMA);}catch(e){}uygula();});
function $(id){return document.getElementById(id);}
var E12=[10,12,15,18,22,27,33,39,47,56,68,82];
function fmtR(v){if(v>=1000)return (Math.round(v/100)/10)+" kΩ";return Math.round(v)+" Ω";}
function ustE12(v){
var exp=Math.floor(Math.log10(v))-1,enIyi=null;
for(var e=-1;e<=3;e++){for(var i=0;i<E12.length;i++){var a=E12[i]*Math.pow(10,exp+e);if(a>=v&&(enIyi===null||a<enIyi))enIyi=a;}}
return enIyi;
}
function coz(){
function sayi(id){var v=parseFloat(($(id).value||"").replace(",","."));return isNaN(v)?null:v;}
var Vs=sayi("inVs"),Vf=sayi("inVf"),Ifma=sayi("inIf"),Pw=sayi("inPw");
var u=$("uyari");u.className="uyari";
if(Vs===null||Vf===null||Ifma===null){$("sonuc").textContent="Tüm değerleri girin.";return null;}
if(Ifma<=0){$("sonuc").textContent="Akım pozitif olmalıdır.";return null;}
if(Vs<=Vf){$("sonuc").textContent="Besleme, LED voltajından büyük olmalıdır.";u.className="uyari goster hata";$("uyariBaslik").textContent="Bağlantı hatası";$("uyariMetin").textContent="Vs ≤ Vf ile LED yanmaz ve hesap yapılamaz.";return null;}
var If=Ifma/1000;
var R=(Vs-Vf)/If;
var std=ustE12(R);
var gercelAkım=(Vs-Vf)/std;
var guc=(Vs-Vf)*gercelAkım;
$("sonuc").innerHTML="Hesaplanan: "+Math.round(R)+" Ω<br>Önerilen (E12 üst): "+fmtR(std)+"<br>Gerçek akım: "+(gercelAkım*1000).toFixed(1)+" mA<br>Direnç gücü: "+guc.toFixed(3)+" W";
if(guc>Pw){u.className="uyari goster hata";$("uyariBaslik").textContent="Güç yetersiz";$("uyariMetin").textContent=fmtR(std)+" dirençte "+guc.toFixed(3)+" W harcanır, "+Pw+" W yetmez. Daha güçlü direnç seçin.";}
else{u.className="uyari goster ok";$("uyariBaslik").textContent="Uygun";$("uyariMetin").textContent=fmtR(std)+" / "+Pw+" W direnç güvenle kullanılır.";}
return {hesap:R,onerilen:std,akim:gercelAkım,guc:guc};
}
["inVs","inVf","inIf","inPw"].forEach(function(id){$(id).addEventListener("input",coz);$(id).addEventListener("change",coz);});
coz();
window.__led={coz:coz,koy:function(vs,vf,ima){$("inVs").value=vs;$("inVf").value=vf;$("inIf").value=ima;return coz();},sonuc:function(){return $("sonuc").textContent;}};
});
</script>
</body></html>
