<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/i.png">
<link rel="apple-touch-icon" href="/i.png">
<title>Kablo Kesiti | Araçlar</title>
<meta name="robots" content="noindex">
<style>:root{--bg:#050a10;--card:#0a1220;--yazi:#e8eef4;--soluk:#8890a0;--cyan:#22d3ee;--yesil:#34d399;--kirmizi:#f87171;--turuncu:#fb923c;--cerceve:rgba(255,255,255,.08)}[data-theme="light"]{--bg:#eef3f8;--card:#ffffff;--yazi:#0f172a;--soluk:#526075;--cyan:#0891b2;--yesil:#059669;--kirmizi:#dc2626;--turuncu:#ea580c;--cerceve:rgba(15,23,42,.12)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--yazi);min-height:100vh}.kapsayici{max-width:560px;margin:0 auto;padding:2rem 1rem}.ustbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}a.don{color:var(--cyan);text-decoration:none;font-weight:700}.kart{background:var(--card);border:1px solid var(--cerceve);border-radius:14px;padding:1.4rem;position:relative;overflow:hidden}.kart::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--turuncu),var(--kirmizi))}label{font-weight:700;font-size:.88rem;display:block;margin:.8rem 0 .3rem}input,select{width:100%;padding:.6rem;border-radius:8px;border:1px solid var(--cerceve);background:#020617;color:#fff;font-size:.95rem}[data-theme="light"] input,[data-theme="light"] select{background:#f1f5f9;color:#0f172a}.satir{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.sonuc{background:#020617;border-radius:10px;padding:.9rem;font-family:Consolas,monospace;font-size:.9rem;margin-top:.9rem;border:1px solid var(--cerceve);line-height:1.8}[data-theme="light"] .sonuc{background:#f1f5f9;color:#0f172a}.uyari{display:none;border-radius:10px;padding:.8rem 1rem;margin-top:.8rem;border:1px solid;font-size:.88rem;line-height:1.6}.uyari.goster{display:block}.uyari.hata{background:rgba(239,68,68,.1);border-color:var(--kirmizi)}.uyari.ok{background:rgba(52,211,153,.1);border-color:var(--yesil)}#temaBtn{position:fixed;top:12px;right:12px;z-index:300;width:66px;height:34px;border-radius:20px;background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid rgba(34,211,238,.5);cursor:pointer;box-shadow:0 0 14px rgba(34,211,238,.25);transition:.25s;padding:0}#temaBtn .top{position:absolute;top:3px;left:4px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#fde047,#fb923c);display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:left .25s;color:#050a10}[data-theme="light"] #temaBtn .top{left:34px;background:linear-gradient(135deg,#38bdf8,#0369a1);color:#fff}</style>
</head><body>
<button id="temaBtn" title="Tema / Theme" aria-label="Tema değiştir"><span class="top">☾</span></button>
<div class="kapsayici">
<div class="ustbar"><a class="don" href="index.html">← Araçlar</a></div>
<div class="kart"><h2>Kablo Kesiti ve Gerilim Düşümü</h2>
<p style="color:var(--soluk);font-size:.88rem">Bakır (ρ = 0.0175 Ω·mm²/m). Gidiş-dönüş toplam 2L üzerinden hesaplanır. %5 üstü düşüş sorun çıkarır.</p>
<div class="satir">
<div><label>Tek yön uzunluk L (m)</label><input id="inL" inputmode="decimal" value="5"></div>
<div><label>Akım I (A)</label><input id="inI" inputmode="decimal" value="2"></div>
</div>
<div class="satir">
<div><label>Kesit (mm²)</label><select id="inS"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.5</option><option>2.5</option><option>4</option><option>6</option></select></div>
<div><label>Kaynak voltajı (V)</label><select id="inV"><option>5</option><option selected>12</option><option>24</option></select></div>
</div>
<div class="sonuc" id="sonuc">Değer girin.</div>
<div class="uyari" id="uyari"><b id="uyariBaslik"></b><p id="uyariMetin" style="margin-top:.3rem"></p></div>
</div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function(){
var TEMA="dark";try{TEMA=localStorage.getItem("portfolioTheme")||"dark";}catch(e){}
function uygula(){document.documentElement.setAttribute("data-theme",TEMA);var s=document.querySelector("#temaBtn .top");if(s)s.textContent=(TEMA==="dark")?"☾":"☀";}
uygula();
document.getElementById("temaBtn").addEventListener("click",function(){TEMA=(TEMA==="dark")?"light":"dark";try{localStorage.setItem("portfolioTheme",TEMA);}catch(e){}uygula();});
function $(id){return document.getElementById(id);}
var RHO=0.0175;
function coz(){
function sayi(id){var v=parseFloat(($(id).value||"").replace(",","."));return isNaN(v)?null:v;}
var L=sayi("inL"),I=sayi("inI"),S=parseFloat($("inS").value),Vs=parseFloat($("inV").value);
var u=$("uyari");u.className="uyari";
if(L===null||I===null||L<=0||I<=0){$("sonuc").textContent="Pozitif uzunluk ve akım girin.";return null;}
var R=RHO*2*L/S;
var dV=I*R, kayip=I*dV, yuzde=dV/Vs*100;
$("sonuc").innerHTML="Tel direnci: "+R.toFixed(3)+" Ω<br>Gerilim düşümü: "+dV.toFixed(3)+" V (%"+yuzde.toFixed(1)+")<br>Kayıp güç: "+kayip.toFixed(3)+" W<br>Yüke kalan: "+(Vs-dV).toFixed(2)+" V";
if(yuzde>5){u.className="uyari goster hata";$("uyariBaslik").textContent="Düşüm yüksek";$("uyariMetin").textContent="%5 üzerinde kayıp var. Daha kalın kesit seçin veya mesafeyi kısaltın.";}
else{u.className="uyari goster ok";$("uyariBaslik").textContent="Uygun";$("uyariMetin").textContent="Düşüm sınırlar içinde.";}
return {R:R,dV:dV,yuzde:yuzde,kayip:kayip};
}
["inL","inI","inS","inV"].forEach(function(id){$(id).addEventListener("input",coz);$(id).addEventListener("change",coz);});
coz();
window.__kablo={coz:coz,koy:function(l,i,s,v){$("inL").value=l;$("inI").value=i;$("inS").value=s;$("inV").value=v;return coz();},sonuc:function(){return $("sonuc").textContent;}};
});
</script>
</body></html>
