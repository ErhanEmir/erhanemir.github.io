<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/i.png">
<link rel="apple-touch-icon" href="/i.png">
<title>Sayı Sistemi Dönüştürücü | Araçlar</title>
<meta name="robots" content="noindex">
<style>:root{--bg:#050a10;--card:#0a1220;--yazi:#e8eef4;--soluk:#8890a0;--cyan:#22d3ee;--yesil:#34d399;--kirmizi:#f87171;--turuncu:#fb923c;--cerceve:rgba(255,255,255,.08)}[data-theme="light"]{--bg:#eef3f8;--card:#ffffff;--yazi:#0f172a;--soluk:#526075;--cyan:#0891b2;--yesil:#059669;--kirmizi:#dc2626;--cerceve:rgba(15,23,42,.12)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--yazi);min-height:100vh}.kapsayici{max-width:640px;margin:0 auto;padding:2rem 1rem}.ustbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}a.don{color:var(--cyan);text-decoration:none;font-weight:700}.kart{background:var(--card);border:1px solid var(--cerceve);border-radius:14px;padding:1.4rem;position:relative;overflow:hidden}.kart::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--cyan),var(--yesil))}label{font-weight:700;font-size:.88rem;display:block;margin:.8rem 0 .3rem}input,select{width:100%;padding:.6rem;border-radius:8px;border:1px solid var(--cerceve);background:#020617;color:#fff;font-size:.95rem}[data-theme="light"] input,[data-theme="light"] select{background:#f1f5f9;color:#0f172a}.satir{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.sonuc{background:#020617;border-radius:10px;padding:.9rem;font-family:Consolas,monospace;font-size:.9rem;margin-top:.9rem;border:1px solid var(--cerceve);line-height:1.8}[data-theme="light"] .sonuc{background:#f1f5f9;color:#0f172a}#temaBtn{position:fixed;top:12px;right:12px;z-index:300;width:66px;height:34px;border-radius:20px;background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid rgba(34,211,238,.5);cursor:pointer;box-shadow:0 0 14px rgba(34,211,238,.25);transition:.25s;padding:0}#temaBtn .top{position:absolute;top:3px;left:4px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#fde047,#fb923c);display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:left .25s;color:#050a10}[data-theme="light"] #temaBtn .top{left:34px;background:linear-gradient(135deg,#38bdf8,#0369a1);color:#fff}
/* Fix input overflow */
input, select {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}
input[type=number] {
    -moz-appearance: textfield;
}
input::placeholder {
    overflow: hidden;
    text-overflow: ellipsis;
}
</style>
</head><body>
<button id="temaBtn" title="Tema / Theme" aria-label="Tema değiştir"><span class="top">☾</span></button>
<div class="kapsayici">
<div class="ustbar"><a class="don" href="index.html">← Araçlar</a></div>
<div class="kart"><h2>Sayı Sistemi Dönüştürücü (2-20 taban)</h2>
<p style="color:var(--soluk);font-size:.88rem">Girdi tabanını (2-20) seçin, değeri girin, hedef tabanı (2-20) seçin. Sonuç anında hesaplanır.</p>
<div class="satir">
<div><label>Kaynak taban (2-20)</label><input id="inKaynak" type="number" min="2" max="20" value="10"></div>
<div><label>Hedef taban (2-20)</label><input id="inHedef" type="number" min="2" max="20" value="2"></div>
</div>
<label>Değer (büyük/küçük harf fark etmez)</label><input id="inDeger" placeholder="örn: 1A3F, 1010, 377">
<div class="sonuc" id="sonuc">Değer girin.</div>
<div class="uyari" id="uyari"><b id="uyariBaslik"></b><p id="uyariMetin" style="margin-top:.3rem"></p></div>
</div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function(){
var TEMA="dark";try{TEMA=localStorage.getItem("portfolioTheme")||"dark";}catch(e){}
function uygula(){document.documentElement.setAttribute("data-theme",TEMA);var s=document.querySelector("#temaBtn .top");if(s)s.textContent=(TEMA==="dark")?"☾":"☀";}
uygula();
document.getElementById("temaBtn").addEventListener("click",function(){TEMA=(TEMA==="dark")?"light":"dark";try{localStorage.setItem("portfolioTheme",TEMA);}catch(e){}uygula();});
function $(id){return document.getElementById(id);}
function coz(){
var kaynak=parseInt($("inKaynak").value),hedef=parseInt($("inHedef").value),girdi=$("inDeger").value.trim().toUpperCase();
var u=$("uyari");u.className="uyari";
if(isNaN(kaynak)||kaynak<2||kaynak>20||isNaN(hedef)||hedef<2||hedef>20){$("sonuc").textContent="Tabanlar 2-20 arası olmalı.";return null;}
if(!/^[0-9A-Z]+$/.test(girdi)){$("sonuc").textContent="Sadece 0-9 ve A-Z kullanın.";return null;}
var onluk=0;for(var i=0;i<girdi.length;i++){var c=girdi[i],v=c>="A"?c.charCodeAt(0)-55:parseInt(c);if(v>=kaynak){$("sonuc").textContent="Basamak kaynak tabandan büyük.";return null;}onluk=onluk*kaynak+v;}
if(onluk===0){$("sonuc").textContent="0";return 0;}
if(hedef===10){$("sonuc").textContent=onluk;return onluk;}
var sonuc="",v=onluk;while(v>0){var k=v%hedef;sonuc=(k<10?k:String.fromCharCode(55+k))+sonuc;v=Math.floor(v/hedef);}
$("sonuc").textContent=sonuc||"0";
return sonuc;}
["inKaynak","inHedef","inDeger"].forEach(function(id){$(id).addEventListener("input",coz);});coz();
window.__sayisistemi={coz:coz,koy:function(k,h,d){$("inKaynak").value=k;$("inHedef").value=h;$("inDeger").value=d;return coz();},sonuc:function(){return $("sonuc").textContent;}};
});
</script>
</body></html>
