<!DOCTYPE html>

<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/i.png">
<link rel="apple-touch-icon" href="/i.png">
<title>Seri Paralel | Araçlar</title>
<meta name="robots" content="noindex">
<style>:root{--bg:#050a10;--card:#0a1220;--yazi:#e8eef4;--soluk:#8890a0;--cyan:#22d3ee;--yesil:#34d399;--kirmizi:#f87171;--cerceve:rgba(255,255,255,.08)}[data-theme="light"]{--bg:#eef3f8;--card:#ffffff;--yazi:#0f172a;--soluk:#526075;--cyan:#0891b2;--yesil:#059669;--kirmizi:#dc2626;--cerceve:rgba(15,23,42,.12)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--yazi);min-height:100vh}.kapsayici{max-width:560px;margin:0 auto;padding:2rem 1rem}.ustbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}a.don{color:var(--cyan);text-decoration:none;font-weight:700}.kart{background:var(--card);border:1px solid var(--cerceve);border-radius:14px;padding:1.4rem;position:relative;overflow:hidden}.kart::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--cyan),var(--yesil))}label{font-weight:700;font-size:.88rem;display:block;margin:.8rem 0 .3rem}input,select{width:100%;padding:.6rem;border-radius:8px;border:1px solid var(--cerceve);background:#020617;color:#fff;font-size:.95rem}[data-theme="light"] input,[data-theme="light"] select{background:#f1f5f9;color:#0f172a}.satir{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.sonuc{background:#020617;border-radius:10px;padding:.9rem;font-family:Consolas,monospace;font-size:.95rem;margin-top:.9rem;border:1px solid var(--cerceve);line-height:1.8}[data-theme="light"] .sonuc{background:#f1f5f9;color:#0f172a}#temaBtn{position:fixed;top:12px;right:12px;z-index:300;width:66px;height:34px;border-radius:20px;background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid rgba(34,211,238,.5);cursor:pointer;box-shadow:0 0 14px rgba(34,211,238,.25);transition:.25s;padding:0}#temaBtn .top{position:absolute;top:3px;left:4px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#fde047,#fb923c);display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:left .25s;color:#050a10}[data-theme="light"] #temaBtn .top{left:34px;background:linear-gradient(135deg,#38bdf8,#0369a1);color:#fff}</style>
</head><body>
<button id="temaBtn" title="Tema / Theme" aria-label="Tema değiştir"><span class="top">☾</span></button>
<div class="kapsayici">
<div class="ustbar"><a class="don" href="index.html">← Araçlar</a></div>
<div class="kart"><h2>Seri / Paralel Birleştirme</h2>
<div class="satir">
<div><label>Tür</label><select id="inTur"><option value="Rs">Direnç seri</option><option value="Rp">Direnç paralel</option><option value="Cs">Kondansatör seri</option><option value="Cp">Kondansatör paralel</option></select></div>
<div><label>Çarpan</label><select id="inBirim"><option value="1">×1</option><option value="1000">×1.000 (k)</option><option value="1000000">×1.000.000 (M)</option><option value="0.001">÷1.000 (m)</option><option value="0.000001">÷1.000.000 (µ)</option></select></div>
</div>
<label>Değerler (virgülle ayırın, örnek: 100, 220, 470)</label><input id="inListe" placeholder="100, 220, 470">
<div class="sonuc" id="sonuc">Değer girin.</div>
</div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function(){
var TEMA="dark";try{TEMA=localStorage.getItem("portfolioTheme")||"dark";}catch(e){}
function uygula(){document.documentElement.setAttribute("data-theme",TEMA);var s=document.querySelector("#temaBtn .top");if(s)s.textContent=(TEMA==="dark")?"☾":"☀";}
uygula();
document.getElementById("temaBtn").addEventListener("click",function(){TEMA=(TEMA==="dark")?"light":"dark";try{localStorage.setItem("portfolioTheme",TEMA);}catch(e){}uygula();});
function $(id){return document.getElementById(id);}
function fmt(v,u){if(v>=1000000)return (v/1000000).toFixed(3)+" M"+u;if(v>=1000)return (v/1000).toFixed(3)+" k"+u;if(v>0&&v<1)return (v*1000).toFixed(2)+" m"+u;if(v>0&&v<0.001)return (v*1000000).toFixed(1)+" µ"+u;return (Math.round(v*1000)/1000)+" "+u;}
function coz(){
var tur=$("inTur").value,carp=parseFloat($("inBirim").value);
var parcalar=($("inListe").value||"").split(",").map(function(x){return parseFloat(x.replace(",","."));}).filter(function(x){return !isNaN(x)&&x>0;});
if(!parcalar.length){$("sonuc").textContent="En az bir pozitif değer girin.";return null;}
var degerler=parcalar.map(function(x){return x*carp;});
var toplam=null,birim=(tur[0]==="R")?"Ω":"F";
if(tur==="Rs"||tur==="Cp"){toplam=degerler.reduce(function(a,b){return a+b;},0);}
else{var t=degerler.reduce(function(a,b){return a+1/b;},0);toplam=1/t;}
$("sonuc").textContent="Toplam: "+fmt(toplam,birim)+"  ("+degerler.length+" parça)";
return {toplam:toplam,adet:degerler.length};
}
["inTur","inBirim","inListe"].forEach(function(id){$(id).addEventListener("input",coz);$(id).addEventListener("change",coz);});
coz();
window.__serpar={coz:coz,koy:function(tur,birim,liste){$("inTur").value=tur;$("inBirim").value=birim;$("inListe").value=liste;return coz();},sonuc:function(){return $("sonuc").textContent;}};
});
</script>
</body></html>
