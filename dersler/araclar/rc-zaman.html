<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/i.png">
<link rel="apple-touch-icon" href="/i.png">
<title>RC Zaman Sabiti | Araçlar</title>
<meta name="robots" content="noindex">
<style>:root{--bg:#050a10;--card:#0a1220;--yazi:#e8eef4;--soluk:#8890a0;--cyan:#22d3ee;--mor:#818cf8;--yesil:#34d399;--kirmizi:#f87171;--cerceve:rgba(255,255,255,.08)}[data-theme="light"]{--bg:#eef3f8;--card:#ffffff;--yazi:#0f172a;--soluk:#526075;--cyan:#0891b2;--mor:#4f46e5;--yesil:#059669;--kirmizi:#dc2626;--cerceve:rgba(15,23,42,.12)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--yazi);min-height:100vh}.kapsayici{max-width:560px;margin:0 auto;padding:2rem 1rem}.ustbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}a.don{color:var(--cyan);text-decoration:none;font-weight:700}.kart{background:var(--card);border:1px solid var(--cerceve);border-radius:14px;padding:1.4rem;position:relative;overflow:hidden}.kart::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--mor),var(--cyan))}label{font-weight:700;font-size:.88rem;display:block;margin:.8rem 0 .3rem}input,select{width:100%;padding:.6rem;border-radius:8px;border:1px solid var(--cerceve);background:#020617;color:#fff;font-size:.95rem}[data-theme="light"] input,[data-theme="light"] select{background:#f1f5f9;color:#0f172a}.satir{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem}.sonuc{background:#020617;border-radius:10px;padding:.9rem;font-family:Consolas,monospace;font-size:.9rem;margin-top:.9rem;border:1px solid var(--cerceve);line-height:1.8}[data-theme="light"] .sonuc{background:#f1f5f9;color:#0f172a}#temaBtn{position:fixed;top:12px;right:12px;z-index:300;width:66px;height:34px;border-radius:20px;background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid rgba(34,211,238,.5);cursor:pointer;box-shadow:0 0 14px rgba(34,211,238,.25);transition:.25s;padding:0}#temaBtn .top{position:absolute;top:3px;left:4px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#fde047,#fb923c);display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:left .25s;color:#050a10}[data-theme="light"] #temaBtn .top{left:34px;background:linear-gradient(135deg,#38bdf8,#0369a1);color:#fff}</style>
</head><body>
<button id="temaBtn" title="Tema / Theme" aria-label="Tema değiştir"><span class="top">☾</span></button>
<div class="kapsayici">
<div class="ustbar"><a class="don" href="index.html">← Araçlar</a></div>
<div class="kart"><h2>RC Zaman Sabiti</h2>
<p style="color:var(--soluk);font-size:.88rem">τ = R × C. 5τ sonunda kondansatör tam dolmuş sayılır. Kesim frekansı fc = 1 / (2πRC).</p>
<div class="satir">
<div><label>R (Ω)</label><input id="inR" inputmode="decimal" value="10000"></div>
<div><label>C (µF)</label><input id="inC" inputmode="decimal" value="100"></div>
<div><label>t (sn, şarj %)</label><input id="inT" inputmode="decimal" value="1"></div>
</div>
<div class="sonuc" id="sonuc">Değer girin.</div>
</div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function(){
var TEMA="dark";try{TEMA=localStorage.getItem("portfolioTheme")||"dark";}catch(e){}
function uygula(){document.documentElement.setAttribute("data-theme",TEMA);var s=document.querySelector("#temaBtn .top");if(s)s.textContent=(TEMA==="dark")?"☾":"☀";}
uygula();
document.getElementById("temaBtn").addEventListener("click",function(){TEMA=(TEMA==="dark")?"light":"dark";try{localStorage.setItem("portfolioTheme",TEMA);}catch(e){}uygula();});
function $(id){return document.getElementById(id);}
function sayi(id){var v=parseFloat(($(id).value||"").replace(",","."));return isNaN(v)?null:v;}
function fmtT(t){if(t>=60)return (t/60).toFixed(2)+" dk";if(t>=1)return t.toFixed(3)+" sn";if(t>=0.001)return (t*1000).toFixed(2)+" ms";return (t*1000000).toFixed(1)+" µs";}
function fmtF(f){if(f>=1000)return (f/1000).toFixed(3)+" kHz";return f.toFixed(3)+" Hz";}
function coz(){
var R=sayi("inR"),Cu=sayi("inC"),t=sayi("inT");
if(R===null||Cu===null||R<=0||Cu<=0){$("sonuc").textContent="R ve C pozitif girilmelidir.";return null;}
var C=Cu*1e-6, tau=R*C;
var yazi="τ = "+fmtT(tau)+"<br>5τ = "+fmtT(5*tau)+"<br>fc = "+fmtF(1/(2*Math.PI*tau));
if(t!==null&&t>=0){
var yuz=(1-Math.exp(-t/tau))*100;
yazi+="<br>t="+t+" sn sonunda şarj = %"+yuz.toFixed(1);
}
$("sonuc").innerHTML=yazi;
return {tau:tau};
}
["inR","inC","inT"].forEach(function(id){$(id).addEventListener("input",coz);});
coz();
window.__rc={coz:coz,koy:function(r,c,t){$("inR").value=r;$("inC").value=c;$("inT").value=t;return coz();},sonuc:function(){return $("sonuc").textContent;}};
});
</script>
</body></html>
