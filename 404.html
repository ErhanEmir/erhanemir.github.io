    <style>
        :root { --bg: #050a10; --cyan: #22d3ee; --green: #34d399; --muted: #8890a0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: #e8eef4; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 2rem 1.5rem;
        }
        .card {
            max-width: 620px; width: 100%; background: #080f1a; border-radius: 14px;
            padding: 2.5rem 2rem; border: 1px solid rgba(255,255,255,0.07);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 900; letter-spacing: 1px; color: var(--cyan); text-shadow: 0 0 15px rgba(34,211,238,0.35); margin-bottom: 0.8rem; }
        p { max-width: 520px; color: #a0aec0; margin: 0 auto 1.6rem; line-height: 1.7; }
        .btn { display: inline-flex; align-items: center; padding: 0.75rem 1.8rem; border-radius: 8px; background: var(--cyan); color: #050a10; font-weight: 800; text-decoration: none; }
        .btn:hover { background: var(--green); }
        .stage-404 { position: relative; width: min(380px, 90vw); height: 230px; margin: 0 auto 1.2rem; }
        .monkey-wrap-404 {
            position: absolute; left: 38%; bottom: 20px; width: 150px; height: 170px;
            transform: translateX(-50%); animation: monkeyRock 1.2s ease-in-out infinite; z-index: 3;
        }
        @keyframes monkeyRock {
            0%, 100% { transform: translateX(-50%) rotate(-3deg); }
            50% { transform: translateX(-46%) rotate(4deg) translateY(-4px); }
        }
        .pcb-404 { position: absolute; right: 10px; bottom: 15px; width: 140px; height: 80px; z-index: 2; }
        .wrench-404 {
            position: absolute; left: 100px; top: 110px; width: 70px; height: 24px;
            transform-origin: 10px 12px; animation: wrenchTurn 0.6s ease-in-out infinite; z-index: 5;
        }
        @keyframes wrenchTurn { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(50deg); } }
        .smoke-sim { position: absolute; right: 45px; bottom: 70px; width: 30px; height: 50px; z-index: 5; pointer-events: none; }
        .smoke-sim span {
            position: absolute; bottom: 0; left: 50%; width: 12px; height: 12px; border-radius: 50%;
            background: rgba(180, 200, 210, 0.4); animation: puffUp 2s ease-out infinite;
        }
        .smoke-sim span:nth-child(2) { animation-delay: 0.6s; left: 25%; }
        .smoke-sim span:nth-child(3) { animation-delay: 1.2s; left: 75%; }
        @keyframes puffUp {
            0% { transform: translate(-50%, 0) scale(0.4); opacity: 0.7; }
            100% { transform: translate(-50%, -60px) scale(1.8); opacity: 0; }
        }
        @media (max-width: 768px) { .card { padding: 2rem 1.2rem; } }
    </style>
</head>
<body>

            <div class="monkey-wrap-404">

                    <ellipse cx="128" cy="142" rx="16" ry="12" fill="#c45c26"/>

                <svg class="wrench-404" viewBox="0 0 70 24">
                    <path d="M4 8 h32 v-3 l22 0 a7 7 0 0 1 0 14 l-22 0 v-3 H4 a4 4 0 0 1 0-8z" fill="#9ca3af" stroke="#22d3ee" stroke-width="1.2"/>
                    <circle cx="8" cy="12" r="4" fill="none" stroke="#34d399" stroke-width="2"/>
