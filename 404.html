<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Hat Kopuk! | Erhan Emir</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2322d3ee' d='M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 2h2v2h-2v-2zm2 2h2v2h-2v-2z'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #050a10;
            --cyan: #22d3ee;
            --green: #34d399;
            --orange: #fb923c;
            --spark: #fde047;
            --text: #e8eef4;
            --muted: #8890a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            min-height: 100vh;
        }
        .pcb-bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(circle at 20% 20%, rgba(34,211,238,.08), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(52,211,153,.07), transparent 40%),
                repeating-linear-gradient(90deg, transparent 0 39px, rgba(34,211,238,.05) 40px),
                repeating-linear-gradient(0deg, transparent 0 39px, rgba(52,211,153,.04) 40px);
        }
        .code-rain {
            position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        }
        .code-col {
            position: absolute; top: -100%; font-family: 'Courier New', monospace;
            font-size: 12px; color: rgba(52,211,153,.22); white-space: nowrap;
            animation: rain linear infinite;
        }
        @keyframes rain {
            to { transform: translateY(120vh); }
        }
        .wrap {
            position: relative; z-index: 2;
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 1.5rem; text-align: center;
        }
        h1 {
            font-size: clamp(2.4rem, 8vw, 5.2rem);
            font-weight: 900; letter-spacing: 2px;
            color: var(--cyan);
            text-shadow: 0 0 12px var(--cyan), 0 0 40px rgba(34,211,238,.55), 0 0 80px rgba(52,211,153,.25);
            animation: titlePulse 2.4s ease-in-out infinite;
            margin-bottom: .8rem;
        }
        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 0 12px var(--cyan), 0 0 40px rgba(34,211,238,.55); }
            50% { text-shadow: 0 0 22px var(--green), 0 0 60px rgba(52,211,153,.7); color: var(--green); }
        }
        .type-line {
            max-width: 640px; min-height: 4.4em;
            font-size: clamp(.92rem, 2.4vw, 1.15rem);
            color: var(--muted); line-height: 1.6; margin: 0 auto 1.6rem;
        }
        .cursor {
            display: inline-block; width: 2px; height: 1.05em;
            background: var(--cyan); margin-left: 2px; vertical-align: -2px;
            animation: blink .7s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .stage {
            position: relative; width: min(420px, 92vw); height: 280px;
            margin: 0 auto 1.4rem;
        }
        .monkey-wrap {
            position: absolute; left: 50%; bottom: 42px;
            width: 180px; height: 200px;
            transform: translateX(-58%);
            transform-origin: 50% 90%;
            animation: monkeyRock 1.1s ease-in-out infinite;
            z-index: 3;
        }
        @keyframes monkeyRock {
            0%, 100% { transform: translateX(-58%) rotate(-4deg) translateY(0); }
            50% { transform: translateX(-50%) rotate(5deg) translateY(-6px); }
        }
        .wrench {
            position: absolute; left: 118px; top: 132px;
            width: 78px; height: 26px;
            transform-origin: 6px 13px;
            animation: wrenchTurn .55s ease-in-out infinite;
            z-index: 5;
            pointer-events: none;
        }
        @keyframes wrenchTurn {
            0%, 100% { transform: rotate(12deg); }
            50% { transform: rotate(58deg); }
        }
        .pcb {
            position: absolute; left: 52%; bottom: 18px;
            width: 168px; height: 92px;
            transform: translateX(-10%);
            z-index: 2;
        }
        .smoke {
            position: absolute; left: 68%; bottom: 88px;
            width: 40px; height: 70px; z-index: 5; pointer-events: none;
        }
        .smoke span {
            position: absolute; bottom: 0; left: 50%;
            width: 14px; height: 14px; border-radius: 50%;
            background: rgba(180,200,210,.35);
            animation: puff 2.2s ease-out infinite;
        }
        .smoke span:nth-child(2) { animation-delay: .7s; left: 30%; }
        .smoke span:nth-child(3) { animation-delay: 1.3s; left: 70%; }
        @keyframes puff {
            0% { transform: translate(-50%, 0) scale(.4); opacity: .7; }
            100% { transform: translate(-50%, -70px) scale(1.8); opacity: 0; }
        }
        .sparks { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
        .spark {
            position: absolute; width: 4px; height: 4px; border-radius: 50%;
            background: var(--spark); box-shadow: 0 0 8px #fff, 0 0 14px var(--orange);
            animation: sparkFly .7s ease-out infinite;
        }
        @keyframes sparkFly {
            0% { opacity: 1; transform: translate(0,0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2); }
        }
        .goggle-glow {
            animation: gogglePulse 1.4s ease-in-out infinite;
        }
        @keyframes gogglePulse {
            0%, 100% { fill: #22d3ee; filter: url(#glow); }
            50% { fill: #34d399; }
        }
        .btns {
            display: flex; flex-wrap: wrap; gap: .8rem; justify-content: center;
        }
        .btn {
            display: inline-flex; align-items: center; gap: .45rem;
            padding: .75rem 1.35rem; border-radius: 10px; font-weight: 700;
            font-size: .95rem; cursor: pointer; text-decoration: none;
            border: 2px solid var(--cyan); transition: .25s ease;
        }
        .btn-home {
            background: var(--cyan); color: #050a10;
            box-shadow: 0 0 18px rgba(34,211,238,.4);
        }
        .btn-home:hover { background: var(--green); border-color: var(--green); transform: translateY(-2px); color: #050a10; }
        .btn-help {
            background: transparent; color: var(--cyan);
        }
        .btn-help:hover { background: rgba(34,211,238,.12); transform: translateY(-2px); }
        .terminal {
            display: none; position: fixed; z-index: 20;
            left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: min(520px, 92vw); background: #020408;
            border: 1px solid var(--cyan); border-radius: 12px;
            box-shadow: 0 0 40px rgba(34,211,238,.35);
            overflow: hidden;
        }
        .terminal.open { display: block; }
        .terminal.dragging { user-select: none; }
        .term-head {
            display: flex; align-items: center; gap: 8px;
            padding: .55rem 1rem; background: rgba(34,211,238,.1);
            border-bottom: 1px solid rgba(255,255,255,.08);
            font-family: 'Courier New', monospace; font-size: .8rem; color: var(--muted);
            cursor: grab;
        }
        .term-head:active { cursor: grabbing; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .term-body {
            height: 180px; overflow-y: auto; padding: .9rem 1rem;
            font-family: 'Courier New', monospace; font-size: .85rem; color: var(--green);
            text-align: left;
        }
        .term-line { margin-bottom: .35rem; white-space: pre-wrap; }
        .term-input-row {
            display: flex; gap: .5rem; padding: .6rem 1rem;
            border-top: 1px solid rgba(255,255,255,.08); background: #000;
        }
        .term-input-row span { color: var(--cyan); font-family: 'Courier New', monospace; font-weight: 700; }
        .term-input-row input {
            flex: 1; background: transparent; border: 0; outline: 0;
            color: var(--text); font-family: 'Courier New', monospace; font-size: .9rem;
        }
        .fade-out { animation: fadeOut .55s ease forwards; }
        @keyframes fadeOut { to { opacity: 0; filter: blur(8px); } }
        @media (max-width: 480px) {
            .stage { height: 240px; }
            .monkey-wrap { width: 150px; height: 170px; }
        }
    </style>
</head>
<body>
    <div class="pcb-bg"></div>
    <div class="code-rain" id="rain"></div>
    <div class="wrap" id="wrap">
        <h1>404 — HAT KOPUK!</h1>
        <p class="type-line"><span id="typed"></span><span class="cursor"></span></p>
        <div class="stage">
            <svg class="pcb" viewBox="0 0 168 92" aria-hidden="true">
                <defs>
                    <filter id="pcbGlow"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                </defs>
                <rect x="2" y="8" width="164" height="80" rx="8" fill="#0a3d28" stroke="#34d399" stroke-width="1.5" filter="url(#pcbGlow)"/>
                <path d="M12 28h40v4H28v20h-4V32H12z M60 22h50 M110 22v28h18 M70 50h30v16h-8" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".85"/>
                <circle cx="28" cy="28" r="4" fill="#fb923c"/><circle cx="110" cy="22" r="4" fill="#22d3ee"/>
                <circle cx="128" cy="50" r="5" fill="#34d399"/><circle cx="92" cy="66" r="4" fill="#fb923c"/>
                <rect x="118" y="58" width="28" height="16" rx="2" fill="#122" stroke="#22d3ee"/>
                <text x="122" y="70" fill="#22d3ee" font-size="8" font-family="monospace">ERR</text>
            </svg>
            <div class="smoke"><span></span><span></span><span></span></div>
            <div class="sparks" id="sparks"></div>
            <div class="monkey-wrap">
                <svg viewBox="0 0 180 200" width="100%" height="100%" aria-label="Cyber monkey mascot">
                    <defs>
                        <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    </defs>
                    <ellipse cx="90" cy="188" rx="38" ry="8" fill="#000" opacity=".35"/>
                    <ellipse cx="62" cy="168" rx="16" ry="22" fill="#6b3f24"/>
                    <ellipse cx="118" cy="168" rx="16" ry="22" fill="#6b3f24"/>
                    <ellipse cx="90" cy="150" rx="42" ry="36" fill="#7a4a2b"/>
                    <rect x="48" y="126" width="32" height="22" rx="7" fill="#c45c26"/>
                    <rect x="100" y="126" width="32" height="22" rx="7" fill="#c45c26"/>
                    <circle cx="90" cy="78" r="48" fill="#8b542f"/>
                    <ellipse cx="38" cy="78" rx="16" ry="22" fill="#6b3f24"/>
                    <ellipse cx="142" cy="78" rx="16" ry="22" fill="#6b3f24"/>
                    <ellipse cx="38" cy="80" rx="10" ry="14" fill="#e8b896"/>
                    <ellipse cx="142" cy="80" rx="10" ry="14" fill="#e8b896"/>
                    <ellipse cx="90" cy="98" rx="32" ry="26" fill="#e8b896"/>
                    <ellipse cx="78" cy="92" rx="8" ry="6" fill="#3a2214"/>
                    <ellipse cx="102" cy="92" rx="8" ry="6" fill="#3a2214"/>
                    <ellipse cx="90" cy="108" rx="10" ry="7" fill="#5c3317"/>
                    <path d="M78 116 Q90 124 102 116" fill="none" stroke="#5c3317" stroke-width="2"/>
                    <rect x="54" y="68" width="72" height="22" rx="11" fill="#111" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
                    <rect class="goggle-glow" x="60" y="72" width="26" height="14" rx="4" fill="#22d3ee" opacity=".85"/>
                    <rect class="goggle-glow" x="94" y="72" width="26" height="14" rx="4" fill="#22d3ee" opacity=".85"/>
                    <rect x="84" y="74" width="12" height="8" fill="#222"/>
                    <path d="M48 58 Q90 42 132 58" fill="none" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/>
                    <ellipse cx="48" cy="148" rx="14" ry="10" fill="#c45c26"/>
                    <ellipse cx="128" cy="142" rx="16" ry="12" fill="#c45c26"/>
                </svg>
                <svg class="wrench" viewBox="0 0 70 22">
                    <path d="M8 4 h28 v4 h22 a8 8 0 0 1 0 10 h-22 v4 H8 a6 6 0 0 1 0-16z" fill="#9ca3af" stroke="#22d3ee" stroke-width="1"/>
                    <circle cx="10" cy="11" r="5" fill="none" stroke="#34d399" stroke-width="2"/>
                    <rect x="38" y="7" width="18" height="8" rx="1" fill="#6b7280"/>
                </svg>
            </div>
        </div>
        <div class="btns">
            <a class="btn btn-home" id="homeBtn" href="index.html">Ana Üsse Dön (Home)</a>
            <button class="btn btn-help" id="helpBtn" type="button">Maymuna Yardım Et (Terminali Aç)</button>
        </div>
    </div>
    <div class="terminal" id="term">
        <div class="term-head">
            <span class="dot" style="background:#ef4444"></span>
            <span class="dot" style="background:#f59e0b"></span>
            <span class="dot" style="background:#10b981"></span>
            <span style="margin-left:.4rem">erhan@maker-pc:~/404</span>
            <button type="button" id="termClose" style="margin-left:auto;background:0;border:0;color:#8890a0;cursor:pointer;font-size:1rem">✕</button>
        </div>
        <div class="term-body" id="termBody">
            <div class="term-line">404 debug shell. Komutlar: help, solder, reboot, home, clear</div>
        </div>
        <div class="term-input-row">
            <span>$</span>
            <input id="termInput" autocomplete="off" placeholder="solder">
        </div>
    </div>
    <script>
        const msg = "Eyvah! Görünüşe göre bu bağlantı yanlış lehimlenmiş veya 3D yazıcının filament koptu. Maymun mühendisimiz sorunu İngiliz anahtarıyla çözmeye çalışıyor!";
        const typed = document.getElementById("typed");
        let i = 0;
        (function type() {
            if (i <= msg.length) { typed.textContent = msg.slice(0, i++); setTimeout(type, 28); }
        })();

        const rain = document.getElementById("rain");
        const bits = ["0x404", "NULL", "GND", "VCC", "SDA", "SCL", "ERR", "0xFF", "NACK", "PWM", "GPIO"];
        for (let c = 0; c < 14; c++) {
            const el = document.createElement("div");
            el.className = "code-col";
            el.style.left = (c * 7.2 + Math.random() * 3) + "%";
            el.style.animationDuration = (8 + Math.random() * 10) + "s";
            el.style.animationDelay = (-Math.random() * 8) + "s";
            el.textContent = Array.from({length: 18}, () => bits[Math.floor(Math.random() * bits.length)]).join("  ");
            rain.appendChild(el);
        }

        const sparks = document.getElementById("sparks");
        function spawnSpark() {
            const s = document.createElement("div");
            s.className = "spark";
            s.style.left = (58 + Math.random() * 18) + "%";
            s.style.top = (58 + Math.random() * 18) + "%";
            s.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
            s.style.setProperty("--dy", (-20 - Math.random() * 50) + "px");
            sparks.appendChild(s);
            setTimeout(() => s.remove(), 700);
        }
        setInterval(spawnSpark, 180);

        document.getElementById("homeBtn").addEventListener("click", (e) => {
            e.preventDefault();
            document.getElementById("wrap").classList.add("fade-out");
            setTimeout(() => { location.href = "index.html"; }, 520);
        });

        const term = document.getElementById("term");
        const termBody = document.getElementById("termBody");
        const termInput = document.getElementById("termInput");
        document.getElementById("helpBtn").addEventListener("click", () => {
            term.classList.add("open");
            termInput.focus();
        });
        document.getElementById("termClose").addEventListener("click", () => term.classList.remove("open"));

        const termHead = term.querySelector(".term-head");
        let drag = null;
        termHead.addEventListener("pointerdown", (e) => {
            if (e.target.id === "termClose") return;
            const r = term.getBoundingClientRect();
            term.style.left = r.left + "px";
            term.style.top = r.top + "px";
            term.style.transform = "none";
            drag = { x: e.clientX - r.left, y: e.clientY - r.top };
            term.classList.add("dragging");
            termHead.setPointerCapture(e.pointerId);
        });
        termHead.addEventListener("pointermove", (e) => {
            if (!drag) return;
            const x = Math.max(0, Math.min(window.innerWidth - term.offsetWidth, e.clientX - drag.x));
            const y = Math.max(0, Math.min(window.innerHeight - 40, e.clientY - drag.y));
            term.style.left = x + "px";
            term.style.top = y + "px";
        });
        termHead.addEventListener("pointerup", () => { drag = null; term.classList.remove("dragging"); });

        function line(t, color) {
            const d = document.createElement("div");
            d.className = "term-line";
            if (color) d.style.color = color;
            d.textContent = t;
            termBody.appendChild(d);
            termBody.scrollTop = termBody.scrollHeight;
        }
        termInput.addEventListener("keydown", (e) => {
            if (e.key !== "Enter") return;
            const cmd = termInput.value.trim().toLowerCase();
            line("$ " + termInput.value, "#e8eef4");
            termInput.value = "";
            if (cmd === "help") line("help | solder | reboot | home | clear");
            else if (cmd === "solder") line("Lehim ısındı... hat kısmen kapandı. Maymun başını salladı. Hâlâ 404.");
            else if (cmd === "reboot") { line("Sistem yeniden başlatılıyor..."); setTimeout(() => location.reload(), 700); }
            else if (cmd === "home") { line("Ana üsse gidiliyor..."); setTimeout(() => { location.href = "https://erhanemir.github.io/"; }, 350); }
            else if (cmd === "clear") termBody.innerHTML = "";
            else line("Komut yok. help yaz.", "#ef4444");
        });
    </script>
</body>
</html>
